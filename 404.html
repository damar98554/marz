<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page Not Found</title>
    <style>
        body {
            background: #050508;
            color: #eeedf2;
            font-family: 'Inter', sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-box {
            padding: 40px;
            border: 1px solid #21212b;
            border-radius: 20px;
            background: #0c0c11;
        }
        h1 { font-size: 80px; color: #a855f7; margin: 0; }
        p { color: #8984a0; }
        a { color: #a855f7; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>404</h1>
        <p>Page not found. Go back to <a href="/">Dashboard</a></p>
    </div>
</body>
</html>
